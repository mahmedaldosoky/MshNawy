<section class="login-card">
  <h1>تسجيل الدخول برقم الهاتف</h1>
  <p>أدخل رقم هاتفك المصري وسنرسل لك رمز تحقق عبر الرسائل.</p>

  <div class="field">
    <label for="phone">رقم الهاتف</label>
    <div class="phone-input">
      <span class="prefix">+20</span>
      <input id="phone" type="tel" maxlength="10" placeholder="10 أرقام" [formControl]="form.controls.phoneDigits" />
    </div>
  </div>

  <button class="primary" (click)="sendOtp()" [disabled]="isSending">
    {{ isSending ? 'جارٍ الإرسال...' : 'أرسل رمز التحقق' }}
  </button>

  <div class="field">
    <label for="otp">رمز التحقق</label>
    <input id="otp" type="text" maxlength="6" placeholder="أدخل 6 أرقام" [formControl]="form.controls.otpCode" />
  </div>

  <div class="countdown" *ngIf="countdownSeconds > 0">
    صالح حتى {{ formattedCountdown }}
  </div>

  <button class="primary" (click)="verifyOtp()" [disabled]="isVerifying">
    {{ isVerifying ? 'جارٍ التحقق...' : 'تأكيد الرمز' }}
  </button>

  <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="success" *ngIf="authResult">
    تم تسجيل الدخول بنجاح. حالة التحقق: {{ authResult.kycStatus }}
  </div>
</section>
